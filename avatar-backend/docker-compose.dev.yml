services:
  avatar-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    image: avatar-backend-dev
    container_name: avatar-backend-dev
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      MODELSCOPE_CACHE: /app/.cache/modelscope
      WATCHFILES_FORCE_POLLING: "true"
      UVICORN_RELOAD: "true"
    ports:
      - "${HOST_PORT:-8210}:8109"
    volumes:
      - .:/app
      - avatar_backend_dev_venv:/opt/venv
      - avatar_backend_dev_pip_cache:/root/.cache/pip
      - ./audio:/app/audio
      - ./pretrained_models:/app/pretrained_models:ro
      - ./Qwen3-TTS-12Hz-1.7B-Base:/app/Qwen3-TTS-12Hz-1.7B-Base:ro
      - avatar_backend_dev_huggingface:/app/.cache/huggingface
      - avatar_backend_dev_modelscope:/app/.cache/modelscope
    shm_size: "2gb"
    runtime: nvidia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    command:
      - bash
      - -lc
      - python -m pip install -r requirements.txt && exec /app/docker-entrypoint.sh

volumes:
  avatar_backend_dev_venv:
    name: avatar_backend_dev_venv
  avatar_backend_dev_pip_cache:
    name: avatar_backend_dev_pip_cache
  avatar_backend_dev_huggingface:
    name: avatar_backend_dev_huggingface
  avatar_backend_dev_modelscope:
    name: avatar_backend_dev_modelscope
