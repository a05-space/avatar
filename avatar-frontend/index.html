<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <link rel="shortcut icon" href="./asset/logo.png">
  <title>经纬-数字人</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #controls {
      position: absolute;
      z-index: 10;
      top: 16px;
      left: 16px;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #WebRender {
      background-color: #ffffff;
      height: 100vh;
      margin: 0px;
    }
  </style>
</head>

<body>
  <div id="controls">
    <input id="audio-input" type="file" accept="audio/*">
    <button id="upload-btn">音频→驱动</button>
    <button id="record-btn">按住说话</button>
    <input id="text-input" type="text" placeholder="输入文本" style="width: 260px;">
    <button id="text2audio-btn">文字→语音</button>
    <button id="text2avatar-btn">文字→驱动</button>
    <audio id="audio-player" style="display: none"></audio>
    <span id="render-info" style="font-size: 12px; color: #333; margin-left: 8px;"></span>
  </div>
  <div id="WebRender"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
